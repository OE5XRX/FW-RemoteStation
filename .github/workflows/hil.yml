name: HIL Bench Gate

# Runs the physical fm_board bench gate on the self-hosted HIL runner.
#
# pull_request_target is used instead of pull_request so the workflow runs
# from the BASE branch (main), not from the PR's branch. This prevents a PR
# that modifies this workflow file from executing arbitrary code on the
# persistent self-hosted bench before a maintainer has reviewed it.
# The firmware under test is still the PR's code — it is checked out
# explicitly in the "Sync west workspace" step below.
#
# Safety: only executes when a trusted maintainer NEWLY adds the 'hil-ok'
# label. The condition gates on github.event.label.name (the label being
# added right now), not on the full label set, so adding any other label
# to a PR that already carries 'hil-ok' does not re-trigger the bench.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

# Least-privilege token. pull_request_target grants a read/write GITHUB_TOKEN by
# default; this workflow only checks out code and reports its own check status
# (which needs no token scope), so drop everything to read-only. Combined with
# persist-credentials: false on the checkout, PR-controlled build steps never see
# a writable token or the token in .git/config. No `secrets.*` are referenced.
permissions:
  contents: read

concurrency:
  group: hil-bench
  cancel-in-progress: false   # never interrupt a running bench cycle

jobs:
  hil_bench_gate:
    name: HIL bench gate (fm_board)
    # For labeled events: fire only when the label being added IS 'hil-ok'.
    # workflow_dispatch is restricted to refs/heads/main: the pull_request_target
    # trigger protects the workflow YAML by running from the base branch, but
    # workflow_dispatch lets a caller select any branch — including a PR branch
    # whose YAML is not yet merged and reviewed. Pinning to main ensures the
    # trusted workflow definition is always what runs on the bench.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.label.name == 'hil-ok'
    runs-on: [self-hosted, hil, fm_board]
    # Bound the whole bench cycle. The concurrency group is non-canceling, so a
    # hung west/dfu-util/serial call would otherwise occupy the single shared
    # bench until GitHub's default 6 h limit and block every later HIL run.
    timeout-minutes: 45
    # Zephyr SDK path — required when the SDK was not CMake-registered at install
    # time (e.g. setup.sh run as root, not as the hil user). West/CMake falls back
    # to this env var before giving up on toolchain discovery.
    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.1

    steps:
      # Fail fast if the west workspace has not been bootstrapped on this runner.
      # The Ansible playbook provisions SDK/venv/fw_hil but does NOT run west init;
      # that one-time step must be done manually (see docs/hil-runner-setup.md §2).
      - name: Assert west workspace is bootstrapped
        run: |
          set -euo pipefail
          if [ ! -d /home/hil/zephyrproject/FW-RemoteStation ]; then
            echo "::error::West workspace not found at /home/hil/zephyrproject/FW-RemoteStation."
            echo "::error::Bootstrap it first: see docs/hil-runner-setup.md section 2."
            exit 1
          fi

      # persist-credentials: false prevents the GITHUB_TOKEN from being stored
      # in .git/config. With pull_request_target the job has elevated token
      # permissions; the subsequent build steps run PR-controlled code, so the
      # token must not be readable from the workspace.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Update the pre-installed west workspace on the bench to the exact commit
      # under test. The workspace at /home/hil/zephyrproject already has the
      # Zephyr kernel + modules; only the manifest repo (FW-RemoteStation) is
      # updated, keeping rebuild cost low.
      #
      # For pull_request_target events the PR head commit may be on a fork and
      # is not part of the base repo's normal refspec. Fetch refs/pull/N/head
      # to reach it reliably.
      #
      # After fetching, verify that the fetched commit matches the SHA captured
      # at workflow-trigger time (github.event.pull_request.head.sha). A fork can
      # be force-pushed between the label event and this step; if refs/pull/N/head
      # no longer resolves to the approved commit, we abort rather than building
      # and flashing an unreviewed commit on the bench.
      #
      # For workflow_dispatch (no PR) fall back to the dispatched commit SHA
      # which IS in the base repo.
      - name: Sync west workspace to PR commit
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `west` lives in the bench venv, not on the systemd runner's default
          # PATH — activate it before the `west patch apply` below (git itself is
          # system-wide, but west is not).
          source /opt/fw-hil-venv/bin/activate
          if [ -n "$PR_NUMBER" ]; then
            # Fetch main so PR_BASE_SHA (a commit on main's history) is reachable
            # for the west.yml change detection below.
            git fetch origin main
            git fetch origin "refs/pull/$PR_NUMBER/head"
            FETCHED_SHA=$(git rev-parse FETCH_HEAD)
            if [ "$FETCHED_SHA" != "$PR_HEAD_SHA" ]; then
              echo "::error::PR head was force-pushed after hil-ok was added." \
                   "Expected $PR_HEAD_SHA, got $FETCHED_SHA." \
                   "Aborting to prevent building an unreviewed commit."
              exit 1
            fi
            git checkout "$PR_HEAD_SHA"
            # If west.yml changed the persistent workspace has stale modules —
            # the bench result would be for the wrong module set. Fail fast.
            if git diff "${PR_BASE_SHA}..${PR_HEAD_SHA}" -- west.yml | grep -q .; then
              echo "::error::PR modifies west.yml — persistent workspace modules may be stale."
              echo "::error::Run 'west update && west patch apply' on the bench, then re-trigger."
              exit 1
            fi
          else
            git fetch origin
            git checkout "$DISPATCH_SHA"
          fi
          west patch apply

      # imgtool is required by the MCUboot sysbuild signing step.
      # It is not pre-installed in the bench venv; install it once here so all
      # three --sysbuild builds below can sign images.
      - name: Install imgtool
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          pip install --quiet imgtool

      # Build baseline: SKIP_SA818=y so the health gate confirms without 12 V.
      # VERSION_TWEAK is explicitly set to 0 so the gate's expected version string
      # matches regardless of what the PR has in app/VERSION.
      # Trap ensures app/VERSION is restored even if the build fails.
      - name: Build baseline firmware (SKIP_SA818=y, VERSION_TWEAK=0)
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          trap "git checkout -- app/VERSION" EXIT
          sed -i 's/^VERSION_TWEAK =.*/VERSION_TWEAK = 0/' app/VERSION
          west build -b fm_board/stm32u575xx --sysbuild app \
            -d build/baseline -p always -- \
            -Dapp_CONFIG_FM_BOOT_CONFIRM_SKIP_SA818=y

      # Build update image: bump VERSION_TWEAK to 1 so the gate can distinguish
      # baseline from updated by reading the version string over CDC.
      # -p always prevents a prior run's CMake/Kconfig cache from leaking
      # stale config into this build (the bench workspace persists between runs).
      - name: Build update firmware (SKIP_SA818=y, VERSION_TWEAK=1)
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          trap "git checkout -- app/VERSION" EXIT
          sed -i 's/^VERSION_TWEAK =.*/VERSION_TWEAK = 1/' app/VERSION
          west build -b fm_board/stm32u575xx --sysbuild app \
            -d build/update -p always -- \
            -Dapp_CONFIG_FM_BOOT_CONFIRM_SKIP_SA818=y
          cp build/update/app/zephyr/zephyr.signed.bin /tmp/hil-update.signed.bin

      # Build unhealthy image: no SKIP_SA818 → health gate fails → MCUboot reverts.
      # -p always prevents the CMake/Kconfig cache from the update build
      # (which had SKIP_SA818=y) from leaking into this build.
      #
      # The revert test is deterministic because the bench runs WITHOUT 12 V supply
      # to the SA818 module. Without power the AT handshake in the health gate
      # always fails, so this image never confirms itself and MCUboot reverts.
      # Bench prerequisite: 12 V rail must remain off during the revert cycle.
      - name: Build unhealthy firmware (no SKIP_SA818, VERSION_TWEAK=2)
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          trap "git checkout -- app/VERSION" EXIT
          sed -i 's/^VERSION_TWEAK =.*/VERSION_TWEAK = 2/' app/VERSION
          west build -b fm_board/stm32u575xx --sysbuild app \
            -d build/unhealthy -p always
          cp build/unhealthy/app/zephyr/zephyr.signed.bin /tmp/hil-unhealthy.signed.bin

      # Run the bench gate: SWD baseline flash → DFU update cycle → DFU revert
      # cycle → USB composite assert. fw_hil is pre-installed in /opt/fw-hil-venv
      # by the Ansible playbook (FW-HIL ansible/site.yml).
      #
      # flash_baseline expects a west sysbuild build directory, not a raw .bin;
      # --baseline-build-dir points at the dedicated baseline build above.
      #
      # working-directory is the synced PR workspace (not $GITHUB_WORKSPACE which
      # contains the base-branch checkout and does not have scripts/hil_bench_gate.py
      # when this script is new in the PR under test).
      #
      # TODO: finalize once fw_hil exposes a dedicated bench-gate CLI entrypoint.
      - name: HIL bench gate — flash → DFU update+revert → USB enum
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          python scripts/hil_bench_gate.py \
            --fw-repo-dir     /home/hil/zephyrproject/FW-RemoteStation \
            --baseline-build-dir /home/hil/zephyrproject/FW-RemoteStation/build/baseline \
            --probe-serial    35FF70064D4D323837380843 \
            --new-image       /tmp/hil-update.signed.bin \
            --unhealthy-image /tmp/hil-unhealthy.signed.bin

      # ── Baustein 8.4: Audio loopback ─────────────────────────────────────────
      # Build the audio-loopback variant: CONFIG_FM_TEST_LOOPBACK=y adds the
      # `audio loopback on/off` shell command and the internal UAC2 OUT->IN
      # routing. SKIP_SA818=y so the health gate self-confirms without the 12 V
      # rail (same rationale as the baseline/update builds above). Dedicated
      # build dir; -p always so no prior build's Kconfig cache leaks in.
      - name: Build audio-loopback firmware (CONFIG_FM_TEST_LOOPBACK=y, SKIP_SA818=y)
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          west build -b fm_board/stm32u575xx --sysbuild app \
            -d build/audio -p always -- \
            -Dapp_CONFIG_FM_TEST_LOOPBACK=y \
            -Dapp_CONFIG_FM_BOOT_CONFIRM_SKIP_SA818=y

      # Purely digital FW loopback (USB OUT -> USB IN, SA818 bypassed): no analog
      # path, no RF, no PTT, no 12 V, no ALSA loopback cable. Flashes the loopback
      # build over SWD, then LiveAudioLoopback arms `audio loopback on`, plays a
      # reference tone on the UAC2 playback device while recording the capture
      # device, scores it (correlation/SNR/dropouts), and disarms on exit.
      # Runs last: it overwrites the DFU-gate firmware with the loopback build.
      - name: HIL audio loopback gate (CONFIG_FM_TEST_LOOPBACK)
        working-directory: /home/hil/zephyrproject/FW-RemoteStation
        run: |
          set -euo pipefail
          source /opt/fw-hil-venv/bin/activate
          python scripts/hil_audio_loopback.py \
            --fw-repo-dir     /home/hil/zephyrproject/FW-RemoteStation \
            --audio-build-dir /home/hil/zephyrproject/FW-RemoteStation/build/audio \
            --probe-serial    35FF70064D4D323837380843 \
            --cdc             /dev/fm-board-cdc \
            --card-hint       "FM Transceiver Board"

  # ── Auto-remove the 'hil-ok' label after every gate run ────────────────────
  # Each 'hil-ok' add is a single, one-shot approval: once the bench has run
  # (pass OR fail), the label is removed so "labeled == approved right now" always
  # holds. A maintainer must consciously re-add it — after re-reading the diff —
  # to run the bench again.
  #
  # This runs as a SEPARATE job on a GitHub-hosted runner, NOT the self-hosted
  # bench, and it deliberately checks out NO code. Removing a label needs
  # `pull-requests: write`, but the bench job (which executes PR-controlled code)
  # is kept at `contents: read`. Isolating the write scope here means PR code
  # never runs in a job that holds a writable token.
  remove-hil-ok-label:
    name: Remove hil-ok label
    needs: hil_bench_gate
    # always(): remove the label whether the gate passed, failed, or was
    # cancelled. Skip for workflow_dispatch (no PR / no label to remove).
    if: always() && github.event_name == 'pull_request_target' && github.event.label.name == 'hil-ok'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove hil-ok label from PR
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'hil-ok',
              });
              core.info('Removed hil-ok label.');
            } catch (error) {
              // 404 == label already gone (e.g. removed manually). Not an error.
              if (error.status === 404) {
                core.info('hil-ok label already absent — nothing to remove.');
              } else {
                throw error;
              }
            }
