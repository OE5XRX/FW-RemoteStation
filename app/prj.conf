# FM Board Application Configuration
# Main project configuration for SA818-based FM transceiver

# =============================================================================
# Language & Standard Library
# =============================================================================
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_EXTERNAL_LIBCPP=y

# =============================================================================
# Console & Serial
# =============================================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# =============================================================================
# Shell Interface
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="fm> "

# Shell subsystem commands
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# =============================================================================
# Storage
# =============================================================================
CONFIG_EEPROM=y
CONFIG_EEPROM_SHELL=y

# =============================================================================
# Peripherals
# =============================================================================

# Audio (RX capture / TX playback) is handled by the analog-audio-in /
# analog-audio-out drivers, which drive the conversions directly via STM32 LL +
# DMA. They still `select ADC`/`select DAC` so the Zephyr adc_stm32/dac_stm32
# subsystems bring the peripherals up (clocks + pinctrl) and coexist with the
# LL data path — the subsystems' streaming APIs themselves are not used.

# GPIO - SA818 control signals
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

# UART - SA818 AT command interface
CONFIG_UART_INTERRUPT_DRIVEN=y

# =============================================================================
# Radio Driver
# =============================================================================
CONFIG_SA818=y
CONFIG_SA818_SHELL=y

# =============================================================================
# Logging
# =============================================================================
# Logs deliberately stay on the CDC-ACM control UART, but MUST route ONLY
# through the shell log backend -- NOT a second, direct UART backend.
#
# CONFIG_SHELL_BACKEND_SERIAL enables CONFIG_SHELL_LOG_BACKEND (default y): the
# shell thread serializes log flushing with its own shell_print output, so a
# MODULE-* protocol response line is emitted whole. A direct CONFIG_LOG_BACKEND_UART
# is a SECOND, async writer (LOG_PROCESS_THREAD, deferred mode) to the same UART
# with no mutual exclusion vs. the shell -- it splits MODULE-* lines mid-string and
# makes the station-agent discovery handshake flap OFFLINE. So it stays OFF.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL_LOG_BACKEND=y
# (CONFIG_LOG_BACKEND_UART intentionally NOT set -- see comment above.)

# =============================================================================
# Embedded Template Library (ETL)
# =============================================================================
# No-alloc fixed-capacity containers (etl::string/vector/map...). ETL routes
# runtime errors to a registered handler (see app/src/etl_error_handler.cpp)
# instead of throwing (exceptions stay disabled).
CONFIG_ETL=y
CONFIG_ETL_LOG_ERRORS=y

# =============================================================================
# Module Platform (self-describing capability interface)
# =============================================================================
# Ship the SAME interface the Twister suite tests: `module fm describe` must
# answer on the shipped app binary, not only in tests/sim_shell. MODULE_SA818
# depends on SA818 (enabled above) and selects CBPRINTF_FP_SUPPORT (needed for
# the %.4f floats in MODULE-RESULT).
CONFIG_MODULE=y
CONFIG_MODULE_SA818=y

# =============================================================================
# Reboot support
# =============================================================================
# Required by sys_reboot() used in h_reboot() (health-gate deadline backstop)
# and wdt_cb() (task_wdt stall path, prod-only).  Minimal symbol; safe in both
# bare and prod builds.
CONFIG_REBOOT=y

# =============================================================================
# Fault handling
# =============================================================================
# Reboot on any fatal error (bus/usage/MPU/stack-overflow fault) instead of
# halting the core forever. A halted core takes USB down with it, so the device
# just goes silent and dead until a physical power cycle -- exactly what a shell
# stack overflow used to do. Rebooting instead: the fault handler still prints
# the ESF/reason to the log UART first, then resets, so USB re-enumerates and the
# failure is observable (and on the prod/MCUboot build a persistently-faulting
# trial image is reverted by the health-gate + IWDG). Trade-off: a deterministic
# fault becomes a reboot loop rather than a hang -- intended: a visible loop is
# recoverable and diagnosable, a silent dead port is neither.
CONFIG_RESET_ON_FATAL_ERROR=y
