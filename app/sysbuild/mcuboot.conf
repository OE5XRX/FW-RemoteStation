#
# MCUboot image configuration fragment for fm_board.
# Applied on top of MCUboot's own prj.conf during a sysbuild build.

# Reject downgrades: an update whose version is <= the running image is refused.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Keep MCUboot small and quiet; logs go to SWO/RTT/UART on the bench (not USB).
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# =============================================================================
# Boot watchdog — IWDG armed by MCUboot before the jump to the app
# =============================================================================
# The app image runs SYSCLK from the 8 MHz HSE crystal (app/boards/
# fm_board.overlay); MCUboot stays on MSIS. If the crystal does not start, the
# app hangs in the clock driver's HSERDY wait — before main(), before its own
# task_wdt exists. With the IWDG already running from MCUboot that hang ends in
# a watchdog reset, and since a freshly updated image is still an unconfirmed
# trial image, MCUboot reverts it to the previous slot.
#
# Hand-over: the app's boot-confirm gate thread starts ~1 s after reset
# (USB init + SA818 power-on delay in main) and its task_wdt re-programs the
# IWDG to CONFIG_TASK_WDT_MIN_TIMEOUT + CONFIG_TASK_WDT_HW_FALLBACK_DELAY and
# keeps feeding it for the rest of the run. Every prod app image since the
# health gate (#87 and older) does this, so reverting to an older image is
# safe. A prod app that fails before starting the gate is now reset as well —
# a trial image is reverted, a confirmed one is retried.
#
# Timeout: 10 s = ~10x the hand-over time while keeping the revert of a hung
# trial image quick. The IWDG runs from LSI (32 kHz, max ~131 s), so the
# MCUboot default of 300 s is not representable and would leave the IWDG off.
# Long operations (image hash, swap) feed it per sector/chunk
# (BOOT_WATCHDOG_FEED). The IWDG pauses while a debugger halts the core
# (subsys/mcuboot_wdt overrides MCUboot's setup to add
# WDT_OPT_PAUSE_HALTED_BY_DBG).
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_SETUP_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_INSTALL_TIMEOUT_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=10000
CONFIG_BOOT_WATCHDOG_FEED=y
